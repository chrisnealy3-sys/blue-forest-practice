<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello from Blue Forest</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%237fb8d9'/%3E%3Cpath d='M16 5.5 21 12h-2.6l3.9 5.2h-3.2l3.5 4.8H9.4l3.5-4.8H9.7l3.9-5.2H11z' fill='%2312324f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --night: #0b1d2e;
      --deep: #12324f;
      --blue: #1f5f8b;
      --sky: #7fb8d9;
      --mist: #e8f1f6;
      --pine: #1d4d3f;
      --moss: #3f7d5f;
      --leaf: #8fd0b0;
      --text: #f4f8fb;
      --muted: #b7cad8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Inter", system-ui, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, var(--night) 0%, var(--deep) 55%, var(--blue) 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px clamp(16px, 5vw, 64px);
      position: relative;
      z-index: 2;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: "Fraunces", serif;
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: 0.01em;
      color: var(--text);
      text-decoration: none;
    }

    .logo svg { width: 32px; height: 32px; }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.95rem;
      margin-left: 24px;
      transition: color 0.2s;
    }
    nav a:hover { color: var(--text); }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 16px 220px;
      position: relative;
      z-index: 2;
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--sky);
      margin-bottom: 20px;
    }

    h1 {
      font-family: "Fraunces", serif;
      font-weight: 700;
      font-size: clamp(3rem, 10vw, 7rem);
      line-height: 1;
      letter-spacing: -0.02em;
      margin-bottom: 24px;
    }

    h1 span {
      background: linear-gradient(90deg, var(--sky), var(--leaf));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .lede {
      max-width: 540px;
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      line-height: 1.6;
      color: var(--muted);
      margin-bottom: 36px;
    }

    .cta {
      display: inline-block;
      padding: 14px 32px;
      border-radius: 999px;
      background: var(--mist);
      color: var(--deep);
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(127, 184, 217, 0.35);
    }

    /* Stars */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(1.5px 1.5px at 10% 15%, #fff8 50%, transparent),
        radial-gradient(1px 1px at 25% 35%, #fff6 50%, transparent),
        radial-gradient(1.5px 1.5px at 40% 10%, #fff7 50%, transparent),
        radial-gradient(1px 1px at 60% 25%, #fff5 50%, transparent),
        radial-gradient(1.5px 1.5px at 75% 12%, #fff8 50%, transparent),
        radial-gradient(1px 1px at 88% 30%, #fff6 50%, transparent),
        radial-gradient(1px 1px at 52% 40%, #fff4 50%, transparent);
    }

    /* Forest silhouette */
    .forest {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 260px;
      pointer-events: none;
      z-index: 1;
    }
    .forest svg { width: 100%; height: 100%; display: block; }

    footer {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 16px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    @media (max-width: 520px) {
      nav { display: none; }
      .forest { height: 180px; }
      main { padding-bottom: 160px; }
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>

  <header>
    <a class="logo" href="#">
      <svg viewBox="0 0 32 32" aria-hidden="true" shape-rendering="geometricPrecision">
        <circle cx="16" cy="16" r="15" fill="var(--sky)"/>
        <path d="M16 5.5 21 12h-2.6l3.9 5.2h-3.2l3.5 4.8H9.4l3.5-4.8H9.7l3.9-5.2H11z" fill="var(--deep)"/>
        <rect x="14.6" y="22" width="2.8" height="3.8" rx=".6" fill="var(--deep)"/>
      </svg>
      Blue Forest
    </a>
    <nav>
      <a href="#">About</a>
      <a href="#">Work</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <p class="eyebrow">Welcome</p>
    <h1>Hello, <span>world.</span></h1>
    <p class="lede">
      We're Blue Forest — growing ideas with deep roots and a clear view of the sky.
      Thanks for stopping by.
    </p>
    <a class="cta" href="#">Say hello</a>
  </main>

  <div class="forest" aria-hidden="true">
    <svg viewBox="0 0 1440 260" preserveAspectRatio="none">
      <!-- back row -->
      <path fill="var(--blue)" fill-opacity=".55" d="M0 260 V150 L40 90 L80 150 L120 70 L160 150 L210 100 L250 150 L300 60 L350 150 L400 95 L440 150 L500 75 L550 150 L600 100 L640 150 L700 65 L760 150 L800 105 L840 150 L900 80 L960 150 L1000 95 L1040 150 L1100 70 L1160 150 L1200 100 L1240 150 L1300 75 L1360 150 L1400 105 L1440 150 V260 Z"/>
      <!-- mid row -->
      <path fill="var(--pine)" d="M0 260 V190 L50 120 L100 190 L150 110 L200 190 L260 130 L310 190 L370 100 L430 190 L480 135 L530 190 L590 115 L650 190 L700 140 L750 190 L820 105 L890 190 L940 130 L990 190 L1050 115 L1110 190 L1160 135 L1210 190 L1280 110 L1350 190 L1400 130 L1440 190 V260 Z"/>
      <!-- front row -->
      <path fill="var(--night)" d="M0 260 V225 L30 175 L60 225 L110 160 L160 225 L200 185 L240 225 L300 155 L360 225 L400 190 L440 225 L510 165 L580 225 L620 185 L660 225 L730 160 L800 225 L840 190 L880 225 L950 165 L1020 225 L1060 185 L1100 225 L1170 160 L1240 225 L1280 190 L1320 225 L1390 170 L1440 225 V260 Z"/>
    </svg>
  </div>

  <footer>© 2026 Blue Forest</footer>
</body>
</html>
